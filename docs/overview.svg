<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">个人英语备考工具使用流程示意</title><desc id="desc">选择目标，导入学习材料，学习并复习词汇的三个步骤。</desc>
<rect width="1200" height="520" rx="24" fill="#0f172a"/>
<circle cx="1050" cy="35" r="220" fill="#1d4ed8" opacity=".18"/><circle cx="-30" cy="500" r="260" fill="#60a5fa" opacity=".08"/>
<g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
<text x="56" y="65" fill="#93c5fd" font-size="16" letter-spacing="3">PERSONAL ENGLISH PREP</text>
<text x="56" y="118" fill="#f8fafc" font-size="35" font-weight="700">从目标到练习，按自己的节奏来。</text>
<text x="56" y="154" fill="#94a3b8" font-size="17">功能流程示意 · 非产品截图</text>
<g transform="translate(56 195)"><rect width="335" height="250" rx="18" fill="#1e293b" stroke="#334155"/><text x="25" y="42" fill="#60a5fa" font-size="16">01 / CHOOSE</text><text x="25" y="86" fill="white" font-size="25" font-weight="700">设定备考目标</text><text x="25" y="126" fill="#cbd5e1" font-size="17">选择考试、目标和每日时间</text><rect x="25" y="160" width="285" height="50" rx="10" fill="#334155"/><text x="41" y="192" fill="#dbeafe" font-size="17">四级 · 六级 · 雅思 · 更多</text></g>
<g transform="translate(432 195)"><rect width="335" height="250" rx="18" fill="#1e293b" stroke="#334155"/><text x="25" y="42" fill="#60a5fa" font-size="16">02 / CREATE</text><text x="25" y="86" fill="white" font-size="25" font-weight="700">生成或导入材料</text><text x="25" y="126" fill="#cbd5e1" font-size="17">自带 AI，或粘贴生成的内容</text><rect x="25" y="160" width="285" height="50" rx="10" fill="#334155"/><text x="41" y="192" fill="#dbeafe" font-size="17">词汇 · 听力 · 阅读 · 写译</text></g>
<g transform="translate(808 195)"><rect width="335" height="250" rx="18" fill="#1e293b" stroke="#334155"/><text x="25" y="42" fill="#60a5fa" font-size="16">03 / PRACTISE</text><text x="25" y="86" fill="white" font-size="25" font-weight="700">练习与回顾</text><text x="25" y="126" fill="#cbd5e1" font-size="17">提交作答，保存进度，复习词汇</text><rect x="25" y="160" width="285" height="50" rx="10" fill="#334155"/><text x="41" y="192" fill="#dbeafe" font-size="17">本机保存 · 可导出备份</text></g>
</g></svg>
